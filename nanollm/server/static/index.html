<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoLM · Offline Mushroom-Safety Chat</title>
<style>
  :root {
    --bg:#fafbfc;        /* canvas */
    --panel:#ffffff;     /* cards */
    --panel-2:#f4f5f7;   /* subtle fill */
    --line:rgba(0,0,0,0.08);
    --fg:#17181c;        /* body text */
    --mut:#6d737c;       /* secondary text */
    --acc:#059669;       /* accent (emerald) */
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  header span { color:var(--mut); font-size:13px; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 120px; }
  #chat { min-height:300px; }
  .msg { margin:14px 0; display:flex; gap:10px; }
  .msg .who { flex:0 0 64px; font-weight:600; font-size:13px; color:var(--mut); }
  .msg.user .who { color:var(--acc); }
  .msg .body { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--panel);
               border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1;
               box-shadow:0 1px 2px rgba(0,0,0,0.03); }
  .msg.user .body { background:var(--panel-2); }
  .caret { display:inline-block; width:8px; height:15px; background:var(--acc);
           vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #presets { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  #presets button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                    border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  #presets button:hover { border-color:var(--acc); color:var(--acc); }
  #inputbar { position:fixed; left:0; right:0; bottom:0; background:var(--panel);
              border-top:1px solid var(--line); padding:12px 16px; }
  #inputbar > div { max-width:820px; margin:0 auto; display:flex; gap:10px; }
  #input { flex:1; background:var(--panel-2); color:var(--fg); border:1px solid var(--line);
           border-radius:10px; padding:11px 14px; font:inherit; resize:none; }
  #input:focus { outline:none; border-color:var(--acc); }
  #send { background:var(--acc); border:0; color:#ffffff; font-weight:600;
          border-radius:10px; padding:0 22px; cursor:pointer; }
  #send:hover:not(:disabled) { filter:brightness(1.06); }
  #send:disabled { opacity:.5; cursor:default; }
  footer { color:var(--mut); font-size:12px; text-align:center; margin-top:24px; }
</style>
</head>
<body>
<header><h1>NanoLM</h1><span>from-scratch GPT · LoRA fine-tuned · offline · zero API cost</span></header>
<main>
  <div id="chat"></div>
  <div id="presets">
    <button data-q="Is the death cap mushroom poisonous?">Death cap?</button>
    <button data-q="How can I tell a chanterelle from a jack-o'-lantern mushroom?">Chanterelle vs jack-o'-lantern</button>
    <button data-q="What should I do if someone eats a poisonous mushroom?">Poisoning first aid</button>
    <button data-q="Are morels safe to eat?">Morels</button>
    <button data-q="How do I take a spore print?">Spore print</button>
  </div>
</main>
<div id="inputbar"><div>
  <textarea id="input" rows="2" placeholder="Ask about mushroom safety… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send">Send</button>
</div></div>
<footer>NanoLM is for education and demonstration only — never rely on it for real mushroom identification.</footer>

<script>
const chat = document.getElementById('chat'), input = document.getElementById('input'),
      send = document.getElementById('send');
let streaming = false;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'NanoLM'}</div><div class="body"></div>`;
  div.querySelector('.body').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector('.body');
}

async function ask(prompt) {
  if (streaming) return;
  streaming = true;
  send.disabled = true;
  addMsg('user', prompt);
  const body = addMsg('assistant', '');
  const caret = document.createElement('span'); caret.className = 'caret';
  body.appendChild(caret);
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt, max_tokens: 160, temperature: 0.7, top_k: 40,
                            repetition_penalty: 1.15, no_repeat_ngram_size: 4}),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let acc = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const text = decoder.decode(value, {stream: true});
      for (const line of text.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const payload = JSON.parse(line.slice(6));
        if (payload.token === '[DONE]') continue;
        acc += payload.token;
        caret.remove();
        body.textContent = acc;
        chat.scrollTop = chat.scrollHeight;
      }
    }
  } catch (e) {
    caret.remove();
    body.textContent = 'Error: ' + e.message;
  } finally {
    streaming = false;
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener('click', () => {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  ask(q);
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
});
document.querySelectorAll('#presets button').forEach(b =>
  b.addEventListener('click', () => ask(b.dataset.q)));
</script>
</body>
</html>
